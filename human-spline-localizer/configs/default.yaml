paths:
  sim_dataset_root: E:/Lehome-Dataset/lehome_round_2_dataset/sim_dataset/robot_sim_ft_lehome_all_garment_data_z180
  human_dataset_root: D:/pretrain_lehome_all_garment_data_z180
  robot_embedding_root: E:/Lehome-Dataset/lehome_round_2_dataset/sim_dataset/robot_sim_ft_lehome_all_garment_data_z180/embeddings/robot_sim_multiview_vae_joint_full_visual_epoch/frame_embeddings
  robot_pairing_root: E:/Lehome-Dataset/lehome_round_2_dataset/sim_dataset/robot_sim_ft_lehome_all_garment_data_z180/embeddings/robot_sim_multiview_vae_joint_full_visual_epoch/human_episode_pairings_uniform_seed032489
  human_bspline_root: D:/pretrain_lehome_all_garment_data_z180/embeddings/human_visual_vae_joint_full_epoch/fitted_bspline_splines
  output_root: D:/LeHome-Challenge/Lehome-Spline-ICRA2027/human-spline-localizer/outputs/default_run

data:
  selected_categories: [shorts, top_long_sleeve, top_short_sleeve]
  robot_embedding_key: mean
  robot_state_source: parquet
  state_dims: all
  history_length: 6
  history_stride: 10
  phase_bin_count: 400
  target_sigma: 0.005
  skip_missing_robot_episodes: true
  skip_missing_human_episodes: false
  verify_alignment: true

validation:
  split_seed: 2027
  per_category_ratio: 0.10
  min_episodes_per_category: 1
  max_episodes_per_category: null

preprocessing:
  overwrite: false
  human_cache_dirname: precomputed_human_spline_cache
  robot_target_cache_dirname: precomputed_robot_alignment_targets
  splits_filename: episode_splits.json
  state_norm_filename: state_normalization.json
  category_metadata_filename: category_metadata.json

model:
  width: 512
  dropout: 0.10
  human:
    coefficient_input_dim: 2048
    coefficient_projection_dim: 512
    transformer_layers: 4
    heads: 8
    ffn_dim: 2048
    rope_coordinate_scale: 200.0
    rope_base: 10000.0
    width_fourier_bands: 16
    width_hidden_dim: 256
    width_encoder: fourier_mlp
  robot:
    visual_input_dim: 2048
    visual_projection_dim: 384
    state_hidden_dim: 256
    state_projection_dim: 128
    fusion_hidden_dim: 512
    transformer_layers: 3
    heads: 8
    ffn_dim: 2048
    temporal_rope_coordinate_mode: relative_steps
    temporal_rope_coordinate_scale: 1.0
    rope_base: 10000.0
  cross_attention:
    layers: 2
    heads: 8
    ffn_dim: 2048
  candidates:
    phase_fourier_bands: 16
    phase_hidden_dim: 256
    expectation_window_radius: 2
  matcher:
    hidden_dim_1: 512
    hidden_dim_2: 128
  auxiliary:
    checkpoint_hidden_dim: 256
    progress_hidden_dim: 256

loss:
  lambda_checkpoint: 0.3
  lambda_progress: 0.2
  progress_delta: 0.1

training:
  seed: 2027
  device: cuda
  epochs: 4
  pairing_slot_schedule: [0, 1, 2, 3]
  batch_size: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  amp: true
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  adam_beta1: 0.9
  adam_beta2: 0.999
  gradient_clip_norm: 1.0
  scheduler: cosine
  warmup_steps: 1000
  validation_frequency_steps: 2000
  train_log_frequency_steps: 100
  validation_log_frequency_steps: 200
  checkpoint_metric: val_total

inference:
  checkpoint_path: D:/LeHome-Challenge/Lehome-Spline-ICRA2027/human-spline-localizer/outputs/default_run/checkpoints/best.pt
  output_root: E:/Lehome-Dataset/lehome_round_2_dataset/sim_dataset/robot_sim_ft_lehome_all_garment_data_z180/embeddings/robot_sim_multiview_vae_joint_full_visual_epoch/human_localizer_predicted_u_default_run
  device: cuda
  batch_size: 64
  amp: true
  overwrite: false
  save_episode_metadata_json: true
  human_cache_capacity: 32
  max_episodes: null

logging:
  wandb:
    enabled: false
    project: human-spline-localizer
    entity: null
    run_name: null
    api_key: null

categories:
  - id: shorts
    sim_start: 250
    sim_end_exclusive: 500
    human_start: 1018
    human_end_exclusive: 2039
  - id: top_long_sleeve
    sim_start: 500
    sim_end_exclusive: 750
    human_start: 2039
    human_end_exclusive: 2875
  # - id: top_short_sleeve
  #   sim_start: 750
  #   sim_end_exclusive: 1000
  #   human_start: 2875
  #   human_end_exclusive: 4180
