server:
  host: 0.0.0.0
  port: 9100
  session_cache_size: 256
  log_every_n_requests: 50

runtime:
  device: cuda
  amp: true
  seed: 2027
  use_last_valid_fallback: true

prompt_selection:
  mode: request
  fixed_prompt_id: null
  fixed_category_id: null
